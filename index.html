<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MACSEC TeaTalk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="macsec.png">
<style>
  /* Düzen: koyu mavi uzay zemini, süzülen mavi glow şekiller, ortada açık mavi parlayan tek satırlık giriş kutusu */

  :root {
    color-scheme: dark;
    --bg: #040b1a;
    --panel: #07142b;
    --fg: #e8f4ff;
    --muted: #7da3c9;
    --line: #17355f;
    --ice: #5fd4ff;        /* açık mavi: kutu şeridi ve parlama */
    --sky: #2fa8ff;
    --royal: #2563ff;
    --deep: #0b3fa8;
    --danger: #ff7a95;
    --ok: #6df0c2;
    --font-display: "Unbounded", "Trebuchet MS", sans-serif;
    --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-block: 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid;
    place-items: center;
    min-height: 100%;
    overflow-x: hidden;
  }

  /* Arka plan */
  .bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
  .bg::after {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(47,168,255,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(47,168,255,.07) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .55; will-change: transform; }
  .b1 { width: 46vmax; height: 46vmax; left: -12vmax; top: -14vmax; background: radial-gradient(circle at 30% 30%, var(--royal), transparent 65%); animation: drift1 26s ease-in-out infinite alternate; }
  .b2 { width: 40vmax; height: 40vmax; right: -10vmax; top: 6vmax; background: radial-gradient(circle at 60% 40%, var(--ice), transparent 65%); opacity: .36; animation: drift2 32s ease-in-out infinite alternate; }
  .b3 { width: 44vmax; height: 44vmax; left: 18vmax; bottom: -22vmax; background: radial-gradient(circle at 50% 50%, var(--sky), transparent 65%); opacity: .4; animation: drift3 29s ease-in-out infinite alternate; }
  .ring { position: absolute; border-radius: 50%; border: 1px solid rgba(95,212,255,.24); box-shadow: 0 0 40px rgba(95,212,255,.16), inset 0 0 40px rgba(37,99,255,.14); }
  .r1 { width: 22vmax; height: 22vmax; right: 8vmax; bottom: 10vmax; animation: drift2 24s ease-in-out infinite alternate-reverse; }
  .r2 { width: 12vmax; height: 12vmax; left: 8vmax; top: 22vmax; border-color: rgba(47,168,255,.3); box-shadow: 0 0 40px rgba(47,168,255,.2), inset 0 0 30px rgba(47,168,255,.1); animation: drift1 20s ease-in-out infinite alternate-reverse; }
  @keyframes drift1 { to { transform: translate(8vmax, 6vmax) scale(1.12); } }
  @keyframes drift2 { to { transform: translate(-7vmax, 8vmax) scale(.92); } }
  @keyframes drift3 { to { transform: translate(6vmax, -7vmax) scale(1.1); } }

  /* Ana alan */
  main { position: relative; z-index: 1; width: min(640px, 100%); }

  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(32px, 8vw, 56px);
    line-height: 1.15;
    letter-spacing: -.01em;
    margin: 0 0 22px;
    text-wrap: balance;
    background: linear-gradient(90deg, #ffffff, var(--ice) 60%, var(--sky));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* Kutu: açık mavi şerit + nefes alan parlama */
  .box {
    position: relative;
    border-radius: 20px;
    padding: 2px;
    background: linear-gradient(135deg, var(--ice), var(--sky) 50%, var(--ice));
    isolation: isolate;
    box-shadow: 0 0 18px rgba(95,212,255,.35);
    animation: glow 3.6s ease-in-out infinite;
  }
  .box::after {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    background: linear-gradient(135deg, var(--ice), var(--sky));
    filter: blur(26px);
    opacity: .5;
    z-index: -1;
    animation: glowblur 3.6s ease-in-out infinite;
  }
  @keyframes glow {
    50% { box-shadow: 0 0 30px rgba(95,212,255,.6); }
  }
  @keyframes glowblur {
    50% { opacity: .8; }
  }

  .inner {
    background: var(--panel);
    border-radius: 18px;
    padding: 10px 10px 10px 18px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
  }

  textarea {
    flex: 1;
    min-width: 0;
    min-height: 48px;
    max-height: 220px;
    resize: none;
    background: transparent;
    border: 0;
    outline: none;
    color: var(--fg);
    font: 500 17px/1.5 var(--font-body);
    padding: 11px 0;
  }
  textarea::placeholder { color: #4f7098; }

  button {
    appearance: none; border: 0; cursor: pointer;
    flex: none;
    width: 48px; height: 48px;
    border-radius: 14px;
    display: grid; place-items: center;
    color: #031024;
    background: linear-gradient(135deg, var(--ice), var(--sky));
    box-shadow: 0 6px 20px rgba(47,168,255,.4);
    transition: transform .15s, box-shadow .2s;
  }
  button svg { width: 22px; height: 22px; }
  button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(95,212,255,.55); }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  button:disabled { opacity: .55; cursor: wait; }

  .status {
    font-size: 14px;
    min-height: 22px;
    margin: 16px 4px 0;
    color: var(--muted);
  }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--danger); }

  @media (prefers-reduced-motion: reduce) {
    .blob, .ring, .box, .box::after { animation: none; }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="ring r1"></div>
    <div class="ring r2"></div>
  </div>

  <main>
    <h1 align="center">MACSEC TeaTalk sorularınız:</h1>

    <form class="box" id="form" autocomplete="off">
      <div class="inner">
        <textarea id="q" name="q" rows="1" placeholder="Sorunu buraya yaz..." aria-label="Sorunu buraya yaz" required></textarea>
        <button type="submit" id="send" aria-label="Gönder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </form>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>

<script>
  // Apps Script web uygulamasını yayınladıktan sonra aldığın adresi buraya yapıştır.
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyKDTIZsAbtgAe2rXEnOe_7c002HdhYdOb_GlRByuDzRDe1Aho8hoGoDyzV0AbW6o16ag/exec";

  const form = document.getElementById("form");
  const q = document.getElementById("q");
  const send = document.getElementById("send");
  const statusEl = document.getElementById("status");
  let sentCount = 0;

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = "status" + (kind ? " " + kind : "");
  }

  function autoGrow() {
    q.style.height = "auto";
    q.style.height = Math.min(q.scrollHeight, 220) + "px";
  }

  async function submitQuestion() {
    const text = q.value.trim();
    if (!text) { setStatus("Önce bir soru yaz.", "err"); q.focus(); return; }
    if (!SCRIPT_URL) { setStatus("SCRIPT_URL boş. index.html içine Apps Script adresini ekle.", "err"); return; }

    send.disabled = true;
    setStatus("Gönderiliyor…");
    try {
      // text/plain ile gönderilir, böylece tarayıcı ön kontrol (CORS preflight) yapmaz.
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ question: text })
      });
      sentCount += 1;
      q.value = "";
      autoGrow();
      //setStatus("Gönderildi. Bu oturumda " + sentCount + " soru eklendi.", "ok");
      setStatus("Gönderildi. Teşekkürler!", "ok");
      q.focus();
    } catch (err) {
      setStatus("Gönderilemedi. İnternet bağlantını ve SCRIPT_URL adresini kontrol et.", "err");
    } finally {
      send.disabled = false;
    }
  }

  form.addEventListener("submit", function (e) { e.preventDefault(); submitQuestion(); });
  q.addEventListener("input", autoGrow);
  // Enter gönderir, Shift+Enter yeni satır açar.
  q.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submitQuestion(); }
  });
</script>
</body>
</html>
